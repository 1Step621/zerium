name: Feature request
description: Suggest a feature or improvement for Zerium.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your use case and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Zerium to support this use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or references that help explain the idea.
