[package]
name = "zerium"
version.workspace = true
edition.workspace = true
description = "A video editor with zero limits."
license.workspace = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "../../plugins/zerium.builtin"
include = ["../../plugins/zerium.builtin/**/*.wesl"]

[features]
default = ["self-update"]
self-update = ["dep:velopack", "dep:windows", "dep:winreg"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.18.2"
cpal = "0.18.2"
directories = "5"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
evalexpr.workspace = true
futures = "0.3"
gpu-video = { git = "https://github.com/software-mansion/smelter", rev = "6637f3df71282c816140cd3bb9821d69b30be2ba" }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-audio = { version = "0.25", features = ["v1_24"] }
gstreamer-pbutils = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gpui = { package = "gpui-ce", git = "https://github.com/1Step621/WGPUI", branch = "fix/input-selection-replacement" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
log = "0.4"
mp4 = "0.14"
pollster = "0.4"
resvg = "0.47"
rfd = "0.17.2"
rtrb = "0.3"
rust-embed = { version = "8.12", features = ["debug-embed"] }
rust-i18n.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3.2"
thiserror.workspace = true
ui = { git = "https://github.com/1Step621/WGPUI-Component", rev = "4a968bcf72c13303b2e89f06e9cbf0fc6ccf8edf" }
unicode-segmentation = "1.12"
url = "2"
velopack = { version = "=1.2.161", optional = true }
wgpu = { version = "30", default-features = false }
zerium-core.workspace = true
zerium-shader.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_UI_Shell"], optional = true }
winreg = { version = "0.56", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
videotoolbox = "0.21"
apple-cf = "0.11"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/1Step621/WGPUI", branch = "fix/input-selection-replacement", features = ["test-support"] }
