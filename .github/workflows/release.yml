name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      VPK_CHANNEL: ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zerium-linux-x86_64
            channel: linux-x86_64
          - os: macos-15
            artifact: zerium-macos-aarch64
            channel: osx-aarch64
          - os: windows-latest
            artifact: zerium-windows-x86_64
            channel: win-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash packaging/linux/install_dependencies.sh

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: bash packaging/macos/install_dependencies.sh

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File packaging/windows/install_dependencies.ps1

      - name: Install Velopack tooling
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Configure release
        id: release
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.161
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ZERIUM_RELEASE_VERSION={version}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Build release binary
        run: cargo build --locked --release

      - name: Download previous release for delta generation
        shell: bash
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir dist
          # A retry may download this version; it cannot serve as its own delta base.
          rm -f "dist/zerium-${ZERIUM_RELEASE_VERSION}-${VPK_CHANNEL}-full.nupkg"

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/package.sh

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/package.sh

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File packaging/windows/package.ps1

      - name: Upload packaged release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.msi
            dist/*-Setup.pkg
            dist/releases.*.json
            dist/zerium-${{ steps.release.outputs.version }}-*.nupkg
            dist/install.sh
            dist/zerium.desktop
            dist/zerium.png
            dist/zerium.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZERIUM_RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packaged releases
        uses: actions/download-artifact@v8
        with:
          pattern: zerium-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash packaging/create_release.sh
