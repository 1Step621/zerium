[package]
name = "zerium"
version = "0.1.0"
edition = "2024"
description = "A video editor with zero limits."
license = "GPL-3.0-or-later"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.15"
cosmic-text = "0.18.2"
directories = "5"
ffmpeg-next = { version = "9", default-features = false, features = ["format", "software-resampling", "software-scaling"] }
gpui = { package = "gpui-ce", git = "https://github.com/1Step621/WGPUI", branch = "fix/input-selection-replacement" }
ui = { git = "https://github.com/1Step621/WGPUI-Component", branch = "fix/input-selection-replacement" }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
rtrb = "0.3"
rust-embed = { version = "8.12", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
wgpu = { version = "30", default-features = false }

[dev-dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/1Step621/WGPUI", branch = "fix/input-selection-replacement", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.deb]
maintainer = "onestep621"
depends = "libasound2 | libasound2t64, libdbus-1-3, libfontconfig1, libfreetype6, libvulkan1, libwayland-client0, libx11-6, libx11-xcb1, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libc6, libgcc-s1"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/zerium", "usr/bin/zerium", "755"],
    ["target/ffmpeg-sdk/lib/*.so*", "usr/lib/zerium/", "755"],
    ["packaging/linux/zerium.desktop", "usr/share/applications/zerium.desktop", "644"],
    ["assets/zerium.png", "usr/share/icons/hicolor/256x256/apps/zerium.png", "644"],
    ["LICENSE", "usr/share/doc/zerium/copyright", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-3.0-or-later"
summary = "A video editor with zero limits."
auto-req = "no"
assets = [
    { source = "target/release/zerium", dest = "/usr/bin/zerium", mode = "0755" },
    { source = "target/ffmpeg-sdk/lib/*.so*", dest = "/usr/lib/zerium/", mode = "0755" },
    { source = "packaging/linux/zerium.desktop", dest = "/usr/share/applications/zerium.desktop", mode = "0644" },
    { source = "assets/zerium.png", dest = "/usr/share/icons/hicolor/256x256/apps/zerium.png", mode = "0644" },
    { source = "LICENSE", dest = "/usr/share/doc/zerium/LICENSE", mode = "0644" },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
dbus-libs = "*"
fontconfig = "*"
freetype = "*"
vulkan-loader = "*"
libwayland-client = "*"
libX11 = "*"
libX11-xcb = "*"
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
glibc = "*"
libgcc = "*"
