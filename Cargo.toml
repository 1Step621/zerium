[workspace]
members = ["crates/zerium", "crates/zerium-core", "crates/zerium-shader"]
default-members = ["crates/zerium"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rhai = { version = "1.25", features = ["sync", "no_module", "no_time"] }
naga = { version = "30", features = ["wgsl-in"] }
rust-i18n = "4.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
zerium-core = { path = "crates/zerium-core" }
zerium-shader = { path = "crates/zerium-shader" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package]
gif = { opt-level = 3 }
color_quant = { opt-level = 3 }
gpui-ce = { opt-level = 3 }
ui = { opt-level = 3 }
resvg = { opt-level = 3 }
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
swash = { opt-level = 3 }
